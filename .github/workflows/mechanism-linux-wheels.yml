name: Mechanism Linux wheels

# Pull requests: build + test the x86_64 wheels (ARM64 is covered by mechanism-arm-wheel.yml).
# Tags mechanism-v*: build every Linux wheel and publish them as a GitHub Release, so apps can
# `pip install` them by URL (no login, no expiring artifacts).
on:
  workflow_dispatch:
  push:
    tags: ["mechanism-v*"]
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/mechanism-linux-wheels.yml
      - CMakeLists.txt
      - Code/**
      - External/**
      - rdkit/**
      - Data/**
      - license.txt
      - Packaging/mechanism/**
      - Docs/Book/data/mechanism_*.py

permissions:
  contents: read

jobs:
  wheel:
    name: ${{ matrix.py }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(startsWith(github.ref, 'refs/tags/')
          && '[{"arch":"x86_64","runner":"ubuntu-24.04","py":"cp313"},{"arch":"x86_64","runner":"ubuntu-24.04","py":"cp314"},{"arch":"aarch64","runner":"ubuntu-24.04-arm","py":"cp313"}]'
          || '[{"arch":"x86_64","runner":"ubuntu-24.04","py":"cp313"},{"arch":"x86_64","runner":"ubuntu-24.04","py":"cp314"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    container:
      image: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    env:
      PY_TAG: ${{ matrix.py }}
      BUILD_DIR: ${{ github.workspace }}/build-mechanism
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust this checkout inside the ephemeral build container
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: build-mechanism/ccache
          key: mechanism-${{ matrix.arch }}-${{ matrix.py }}-v1-${{ hashFiles('CMakeLists.txt', 'Code/**', 'External/**') }}
          restore-keys: mechanism-${{ matrix.arch }}-${{ matrix.py }}-v1-
      - name: Build and verify the wheel
        shell: bash
        run: bash Packaging/mechanism/build_linux.sh
      - name: Save compiler cache even if packaging fails
        if: always() && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-mechanism/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: rdkit-mechanism-${{ matrix.py }}-${{ matrix.arch }}
          path: build-mechanism/wheelhouse/*.whl
          if-no-files-found: error
      - name: Upload rendered smoke-test examples
        uses: actions/upload-artifact@v4
        with:
          name: mechanism-examples-${{ matrix.py }}-${{ matrix.arch }}
          path: build-mechanism/installed-examples/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/mechanism-v')
    needs: wheel
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rdkit-mechanism-*
          path: wheels
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l wheels
          gh release create "$TAG" wheels/*.whl --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "RDKit fork with native mechanism (electron-flow) drawing. Install a wheel matching your platform with \`pip install <url>\`; do not mix with stock rdkit in the same environment."
